# Local infrastructure + app stack.
# Data only:  docker compose -f infrastructure/docker/docker-compose.yml up -d postgres redis
# Full stack: docker compose -f infrastructure/docker/docker-compose.yml up -d --build
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: crs
      POSTGRES_PASSWORD: crs
      POSTGRES_DB: crs
    ports:
      - "5432:5432"
    volumes:
      - crs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crs"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    environment:
      CRS_DATABASE_URL: postgresql+psycopg://crs:crs@postgres:5432/crs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build:
      context: ../../apps/frontend
    environment:
      NEXT_PUBLIC_API_BASE: /
    depends_on:
      - backend
    expose:
      - "3000"

  nginx:
    image: nginx:1.27
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

volumes:
  crs_pgdata:
